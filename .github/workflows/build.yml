name: Build Windows MSI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      
      - name: Install WiX Toolset
        run: choco install wixtoolset -y
      
      - name: Build Windows MSI
        # This triggers the jpackage goal registered by the badass-jlink-plugin
        run: mvn clean jpackage
        
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPOS-Installer
          path: target/jpackage/*.msi